<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оптический анализатор частиц</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    [v-cloak] { display: none; }
  </style>
</head>
<body>

<div id="app" v-cloak>
  <div v-if="appError" class="alert alert-danger mb-0">{{ appError }}</div>

  <!-- Шапка приложения -->
  <div class="app-header">
    <div class="app-header-icon">◉</div>
    <div>
      <div class="app-header-title">Оптический анализатор частиц</div>
      <div class="app-header-sub">Optical Particle Analyzer</div>
    </div>
  </div>

  <!-- Навигация -->
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link" :class="{ active: currentTab === 'home' }"
         @click="currentTab = 'home'">Исследования</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" :class="{ active: currentTab === 'analyze' }"
         @click="currentTab = 'analyze'">Анализ</a>
    </li>
    <li class="nav-item">
      <a class="nav-link"
         :class="{ active: currentTab === 'results', disabled: !resultsAvailable }"
         @click="resultsAvailable && (currentTab = 'results')"
         title="Доступно после анализа">Результаты</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" :class="{ active: currentTab === 'calibration' }"
         @click="currentTab = 'calibration'">Калибровка</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" :class="{ active: currentTab === 'settings' }"
         @click="currentTab = 'settings'">Настройки</a>
    </li>
  </ul>

  <!-- Содержимое вкладок -->
  <div class="px-3">
    <div class="tab-content border p-3 mt-2">
      <home-view        v-show="currentTab === 'home'"></home-view>
      <analyze-view     v-show="currentTab === 'analyze'"></analyze-view>
      <results-view     v-show="currentTab === 'results'"></results-view>
      <calibration-view v-show="currentTab === 'calibration'"></calibration-view>
      <settings-view    v-show="currentTab === 'settings'"></settings-view>
    </div>
  </div>

</div><!-- /#app -->

<script src="js/vue.global.prod.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/chart.umd.js"></script>
<script src="api.js"></script>
<script src="components/CameraPanel.js"></script>
<script src="views/HomeView.js"></script>
<script src="views/AnalyzeView.js"></script>
<script src="views/ResultsView.js"></script>
<script src="views/CalibrationView.js"></script>
<script src="views/SettingsView.js"></script>
<script>
const { createApp } = Vue;

const app = createApp({
  data() {
    return {
      currentTab: 'home',  // 'home' | 'analyze' | 'results' | 'calibration' | 'settings'
      microscopes:    [],
      divisionPrices: [],
      // Общее состояние анализа: пишет AnalyzeView, читает ResultsView
      results:  [],
      averages: {},
      selectedResearch:           null,
      analyzeSelectedCalibration: null,
      analyzeResetKey:            0,
      researchRevision: 0,
      calibrationRevision: 0,
      appError: '',
      researchPending: false,
    };
  },
  computed: {
    resultsAvailable() {
      return Array.isArray(this.results) && this.results.length > 0;
    },
  },
  methods: {
    async init() {
      const mics = await api.getMicroscopes();
      if (mics.ok) this.microscopes = mics.microscopes;

      const divs = await api.getDivisionPrices();
      if (divs.ok) this.divisionPrices = divs.division_prices;
      const research = await api.getSessionState('research');
      const calibration = await api.getSessionState('calibration');
      if (research.ok) this.researchRevision = Math.max(this.researchRevision, research.revision);
      if (calibration.ok) this.calibrationRevision = Math.max(this.calibrationRevision, calibration.revision);
      if (!mics.ok || !divs.ok) this.appError = mics.error || divs.error || 'Не удалось загрузить настройки';
    },
    resetResearch(result) {
      this.researchRevision = result.revision;
      this.selectedResearch = null;
      this.analyzeSelectedCalibration = null;
      this.results = [];
      this.averages = {};
      this.analyzeResetKey++;
    },
    onResearchDeleted(identifier, result) {
      if (!result.active || result.revision < this.researchRevision) return;
      this.researchRevision = result.revision;
      if (this.selectedResearch?.id === identifier) this.selectedResearch = {...this.selectedResearch, id:0};
      this.results = [];
      this.averages = {};
      this.analyzeResetKey++;
      if (this.currentTab === 'results') this.currentTab = 'analyze';
    },
    async invalidateResearch() {
      if (this.researchPending) return;
      this.researchPending = true;
      this.results = [];
      this.averages = {};
      const result = await api.invalidateResearch(this.researchRevision);
      if (result.ok) this.researchRevision = result.revision;
      else {
        const state = await api.getSessionState('research');
        if (state.ok) this.researchRevision = state.revision;
        this.appError = result.error;
      }
      this.researchPending = false;
    },
    formatDate(dateStr) {
      if (!dateStr) return '-';
      return new Date(dateStr).toLocaleString('ru-RU');
    },
  },
  mounted() {
    this.init();
  },
});

app.component('HomeView',        window.HomeView);
app.component('AnalyzeView',     window.AnalyzeView);
app.component('ResultsView',     window.ResultsView);
app.component('CalibrationView', window.CalibrationView);
app.component('SettingsView',    window.SettingsView);
app.component('CameraPanel',     window.CameraPanel);

let _mounted = false;
function startApp() {
  if (_mounted) return;
  if (!window.pywebview || !window.pywebview.api) return;
  _mounted = true;
  app.mount('#app');
}

window.addEventListener('pywebviewready', startApp);
setTimeout(() => { if (!_mounted) startApp(); }, 500);
</script>
</body>
</html>
